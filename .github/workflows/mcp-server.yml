name: MCP Server CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test MCP server
        run: ./gradlew -p mcp-server build shadowJar --stacktrace

      - name: Upload MCP test results
        uses: actions/upload-artifact@v7
        if: failure() || always()
        with:
          name: mcp-server-test-results
          path: mcp-server/build/reports/tests/test/
          if-no-files-found: ignore
